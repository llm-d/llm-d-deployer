
multinode: true
inferencePool: true
inferenceModel: true
httpRoute: true
routing:
  modelName: meta-llama/Llama-3.2-3B-Instruct
  servicePort: 8080   # Sidecar listens on this port for requests. If there's no sidecar, the request goes here
  proxy:
    image:
      registry: "ghcr.io"
      repository: "llm-d/llm-d-routing-sidecar"
      tags: "0.0.6"
    targetPort: 8200
    debugLevel: 5
  parentRefs:
  - name: inference-gateway # this part needs to be dealt with moving to the upstream charts

modelArtifacts:
  # When specifying the URI with `hf` prefix, the <repo-id>/<model-id> string
  # is extracted and exposed as a template variable that can be used as {{ .HFModelName }}

  uri: "hf://meta-llama/Llama-3.2-3B-Instruct"
  authSecretName: "llm-d-hf-token"
  size: 5Mi

# describe decode pods
decode:
  enableService: false
  replicas: 1
  containers:
  - name: "vllm"
    image: "ghcr.io/llm-d/llm-d:0.0.8"
    command:
      - vllm
      - serve
    args:
      - "--enforce-eager"
      - "--kv-transfer-config"
      - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
    env:
      - name: CUDA_VISIBLE_DEVICES
        value: "0"
      - name: UCX_TLS
        value: "cuda_ipc,cuda_copy,tcp"
      - name: HF_HOME
        value: /model-cache
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: VLLM_LOGGING_LEVEL
        value: DEBUG
    ports:
      - containerPort: 5557
        protocol: TCP
    resources:
      limits:
        memory: 16Gi
        cpu: "16"
        nvidia.com/gpu: "1"
      requests:
        cpu: "16"
        memory: 16Gi
        nvidia.com/gpu: "1"
    mountModelVolume: true

# describe prefill pods
prefill:
  replicas: 1
  containers:
  - name: "vllm"
    image: "ghcr.io/llm-d/llm-d:0.0.8"
    command:
      - vllm
      - serve
    args:
      - "--enforce-eager"
      - "--kv-transfer-config"
      - '{"kv_connector":"NixlConnector", "kv_role":"kv_both"}'
    env:
      - name: CUDA_VISIBLE_DEVICES
        value: "0"
      - name: UCX_TLS
        value: "cuda_ipc,cuda_copy,tcp"
      - name: VLLM_NIXL_SIDE_CHANNEL_PORT
        value: "5557"
      - name: VLLM_NIXL_SIDE_CHANNEL_HOST
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: VLLM_LOGGING_LEVEL
        value: DEBUG
    ports:
      - containerPort: 8000
        protocol: TCP
      - containerPort: 5557
        protocol: TCP
    resources:
      limits:
        memory: 16Gi
        cpu: "16"
        nvidia.com/gpu: "1"
      requests:
        cpu: "16"
        memory: 16Gi
        nvidia.com/gpu: "1"

endpointPicker:
  image: ghcr.io/llm-d/llm-d-inference-scheduler:0.0.4
  debugLevel: 5
  service:
    type: ClusterIP
    port: 9002
    targetPort: 9002
    appProtocol: http2
  # The name of cluster role containing permissions to be granted to endpointPicker (via a role binding to the service account)
  permissions: pod-read

  autoscaling:
    enabled: false
  replicas: 1
