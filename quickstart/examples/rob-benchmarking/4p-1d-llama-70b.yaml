sampleApplication:
    baseConfigMapRefName: basic-gpu-with-nixl-preset
    model:
        modelArtifactURI: hf://RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic
        modelName: "RedHatAI/Llama-3.3-70B-Instruct-FP8-dynamic"
        auth:
            hfToken:
                name: llm-d-hf-token
                key: HF_TOKEN
    prefill:
        replicas: 4
        resources:
          limits:
            nvidia.com/gpu: 1
            rdma/ib: 1
          requests:
            nvidia.com/gpu: 1
            rdma/ib: 1
            cpu: "32"
            memory: 128Gi
        extraArgs:
            - "--tensor-parallel-size"
            - "1"
            - "--disable-log-requests"
            - "--max-model-len"
            - "32768"
            - "--block-size"
            - "128"
    decode:
        replicas: 1
        resources:
          limits:
            nvidia.com/gpu: 4
            rdma/ib: 1
          requests:
            nvidia.com/gpu: 4
            rdma/ib: 1
            cpu: "32"
            memory: 128Gi
        extraArgs:
            - "--tensor-parallel-size"
            - "4"
            - "--disable-log-requests"
            - "--max-model-len"
            - "32768"
            - "--block-size"
            - "128"
modelservice:
  vllm:
    image:
      registry: docker.io    
      repository: robertgouldshaw2/vllm-nixl
      tag: nixl-oh-debug-fixed-0.3
  epp:
    defaultEnvVarsOverride:
      - name: ENABLE_KVCACHE_AWARE_SCORER
        value: "false"
      - name: ENABLE_PREFIX_AWARE_SCORER
        value: "false"
      - name: ENABLE_LOAD_AWARE_SCORER
        value: "false"
      - name: ENABLE_SESSION_AWARE_SCORER
        value: "false"
      - name: PD_ENABLED
        value: "true"
      - name: PD_PROMPT_LEN_THRESHOLD
        value: "10"
      - name: PREFILL_ENABLE_KVCACHE_AWARE_SCORER
        value: "false"
      - name: PREFILL_ENABLE_LOAD_AWARE_SCORER
        value: "false"
      - name: PREFILL_ENABLE_PREFIX_AWARE_SCORER
        value: "false"
      - name: PREFILL_ENABLE_SESSION_AWARE_SCORER
        value: "false"
redis:
  enabled: false